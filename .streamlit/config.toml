# ExoBiome - light theme with a minimal crimson/bordeaux accent.
# Clean near-white scientific canvas + a refined crimson accent and a whisper of
# blush, drawn from the "Soft Blush / Crimson Silk / Ruby Red / Deep Bordeaux"
# palette. Native theming only - no custom CSS (per developing-with-streamlit skill).

[theme]
base = "light"
primaryColor = "#B11226"              # refined crimson (Crimson Silk family) - white button text is AA-safe
backgroundColor = "#FEFAFA"           # whisper-of-blush near-white
secondaryBackgroundColor = "#F8F0F1"  # soft blush-grey - cards / widgets / sidebar
codeBackgroundColor = "#F8F0F1"
textColor = "#241C1E"                 # warm dark slate
linkColor = "#B11226"
borderColor = "#EBDFE1"               # soft warm hairline
codeTextColor = "#4A3B3E"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

# Typography - Inter for UI, JetBrains Mono for code/numbers
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors - red drawn from the palette (Crimson Silk), green kept for deltas
greenColor = "#1A7F5A"
redColor = "#D72638"
yellowColor = "#B7791F"
orangeColor = "#C2641A"
blueColor = "#2D6CC0"
violetColor = "#6D5BD0"
grayColor = "#6B6065"

# Categorical chart palette - crimson reference (truth) + distinguishable, muted model hues + a bordeaux accent.
chartCategoricalColors = ["#B11226", "#7A8699", "#3D52A0", "#2F8F84", "#C98A3A", "#3F0D12", "#9B5DE0", "#C25A6B"]

# Sequential palette (soft blush -> deep bordeaux) for spectra / heatmaps - exactly 10 colors
chartSequentialColors = ["#FBE4E3", "#F4C9C8", "#E9A6A6", "#DD8384", "#CF5F62", "#BE3F44", "#A8252D", "#8A171F", "#651016", "#3F0D12"]

# Dataframe styling
dataframeBorderColor = "#EBDFE1"
dataframeHeaderBackgroundColor = "#F8F0F1"

# Sidebar - blush-tinted, one notch deeper than the canvas for quiet depth
[theme.sidebar]
backgroundColor = "#F8F0F1"
secondaryBackgroundColor = "#F0E3E4"
codeBackgroundColor = "#F0E3E4"
textColor = "#241C1E"
borderColor = "#EBDFE1"
primaryColor = "#B11226"

[browser]
gatherUsageStats = false
