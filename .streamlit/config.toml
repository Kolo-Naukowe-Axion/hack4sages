# ExoBiome - professional light theme.
# Cool near-white scientific canvas + one muted slate-indigo accent + a soft,
# hue-varied, mid-saturation categorical palette (readable as bars on white).
# Native theming only - no custom CSS (per developing-with-streamlit skill).

[theme]
base = "light"
primaryColor = "#3D52A0"              # muted slate-indigo - white button text is AA (~6.7:1)
backgroundColor = "#FCFCFD"           # cool near-white (softer than pure white)
secondaryBackgroundColor = "#F1F3F8"  # light cool grey - cards / widgets / code / sidebar
codeBackgroundColor = "#F1F3F8"
textColor = "#1F2530"                 # dark slate charcoal (~13:1 on background)
linkColor = "#3D52A0"
borderColor = "#E2E5EC"               # soft hairline grey
codeTextColor = "#384152"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

# Typography - Inter for UI, JetBrains Mono for code/numbers
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors (badges, status, error highlighting) - readable on white
greenColor = "#1A7F5A"
redColor = "#C0392B"
yellowColor = "#B7791F"
orangeColor = "#C2641A"
blueColor = "#2D6CC0"
violetColor = "#6D5BD0"
grayColor = "#64748B"

# Categorical chart palette - soft, hue-varied, mid-saturation; distinct as bars on white.
chartCategoricalColors = ["#3D52A0", "#3A9D8E", "#C98A3A", "#9B5DE0", "#C25A6B", "#5B8DC9", "#6B8F3E", "#7A8699"]

# Sequential palette (slate-indigo gradient) for spectra / heatmaps - exactly 10 colors
chartSequentialColors = ["#EEF1FA", "#D7DDF1", "#BDC6E7", "#A2AFDC", "#8797D0", "#6C7FC4", "#5468B0", "#42549A", "#33437F", "#243162"]

# Dataframe styling
dataframeBorderColor = "#E2E5EC"
dataframeHeaderBackgroundColor = "#F1F3F8"

# Sidebar - one notch deeper than the canvas for quiet depth (not a dark sidebar)
[theme.sidebar]
backgroundColor = "#F1F3F8"
secondaryBackgroundColor = "#E7EAF2"
codeBackgroundColor = "#E7EAF2"
textColor = "#1F2530"
borderColor = "#E2E5EC"
primaryColor = "#3D52A0"

[browser]
gatherUsageStats = false
