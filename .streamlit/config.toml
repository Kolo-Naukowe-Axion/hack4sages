# ExoBiome - professional light theme with a navy / sapphire accent.
# Drawn from the "Ice Blue / Powder Blue / Sapphire / Deep Navy" palette.
# Native theming only - no custom CSS (per developing-with-streamlit skill).

[theme]
base = "light"
primaryColor = "#0F52BA"              # sapphire - white button text is AA-safe
backgroundColor = "#FBFCFE"           # cool near-white (whisper of ice blue)
secondaryBackgroundColor = "#EAF1F8"  # light ice/powder blue - cards / widgets / sidebar
codeBackgroundColor = "#EAF1F8"
textColor = "#0E1B36"                 # deep navy text
linkColor = "#0F52BA"
borderColor = "#D2DEEC"               # soft blue-grey hairline
codeTextColor = "#28344F"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

# Typography - Inter for UI, JetBrains Mono for code/numbers
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["30px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
linkUnderline = false

# Semantic colors - blue from the palette, green/red kept for status
greenColor = "#1A7F5A"
redColor = "#C0392B"
yellowColor = "#B7791F"
orangeColor = "#C2641A"
blueColor = "#0F52BA"
violetColor = "#5B5BD6"
grayColor = "#5B6675"

# Categorical chart palette - navy reference (truth) + distinguishable blues, all readable as solid bars on white.
chartCategoricalColors = ["#000926", "#A6C5D7", "#4F86C6", "#0F52BA", "#2459AE", "#7FA9CE", "#3D6FB8"]

# Sequential palette (ice blue -> deep navy) for spectra / heatmaps - exactly 10 colors
chartSequentialColors = ["#D6E6F3", "#BCD4E8", "#A6C5D7", "#7FA9CE", "#5E8CC4", "#3D6FB8", "#2459AE", "#0F52BA", "#073A86", "#000926"]

# Dataframe styling
dataframeBorderColor = "#D2DEEC"
dataframeHeaderBackgroundColor = "#EAF1F8"

# Sidebar - ice-blue tinted (unused in the current layout but kept consistent)
[theme.sidebar]
backgroundColor = "#EAF1F8"
secondaryBackgroundColor = "#DCE7F3"
codeBackgroundColor = "#DCE7F3"
textColor = "#0E1B36"
borderColor = "#D2DEEC"
primaryColor = "#0F52BA"

[browser]
gatherUsageStats = false
